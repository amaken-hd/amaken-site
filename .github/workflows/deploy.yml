name: CI/ CD Pipeline
on:
  push:
    branches:
      - main



jobs:
  test-build-then-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      
      # - name: Setup Node.js
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: '22'
          
      # - name: Install & Build
      #   run: |
      #     npm install
      #     npm run build

      - name: deploy to VPS
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          command_timeout: 20m
          script: |
            cd /home/goamaken/public_html/amaken-site/ || exit 1
            git pull origin main
            export NVM_DIR="/opt/nvm"
            source /opt/nvm/nvm.sh
            nvm use 22
            node -v
            npm install 
            
            # add .env variables
            cat > .env << EOF
            NEXT_PUBLIC_ERPNEXT_URL=${{ secrets.NEXT_PUBLIC_ERPNEXT_URL }}
            ERP_API_KEY=${{ secrets.ERP_API_KEY }}
            ERP_API_SECRET=${{ secrets.ERP_API_SECRET }}
            EOF
            
            npm run build
            ps aux | grep "node.*server.js" | grep -v grep
            pkill -f "node.*server.js" || true